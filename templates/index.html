<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CEP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f80303 0%, #b65405 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #resultado {
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
            display: none;
        }
        #resultado.sucesso {
            display: block;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        #resultado.erro {
            display: block;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        #resultado h3 {
            margin-bottom: 10px;
        }
        #resultado p {
            margin: 5px 0;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Buscador de CEP</h1>
        <div class="input-group">
            <input type="text" id="cep" placeholder="Digite o CEP (ex: 01001-000)" maxlength="9">
            <button id="buscarBtn">Buscar</button>
        </div>
        <div id="resultado"></div>
        <div id="loading" class="loading" style="display:none;">⏳ Buscando...</div>
    </div>

    <script>
        document.getElementById('buscarBtn').addEventListener('click', buscarCEP);
        document.getElementById('cep').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarCEP();
        });

        // Formata o CEP enquanto digita
        document.getElementById('cep').addEventListener('input', function(e) {
            let cep = this.value.replace(/\D/g, '');
            if (cep.length > 5) {
                cep = cep.substring(0, 5) + '-' + cep.substring(5, 8);
            }
            this.value = cep;
        });

        async function buscarCEP() {
            const cepInput = document.getElementById('cep');
            const resultado = document.getElementById('resultado');
            const loading = document.getElementById('loading');
            const btn = document.getElementById('buscarBtn');
            
            let cep = cepInput.value.replace(/\D/g, '');
            
            if (cep.length !== 8) {
                resultado.className = 'erro';
                resultado.innerHTML = '<h3>⚠️ Erro</h3><p>Digite um CEP válido com 8 dígitos.</p>';
                resultado.style.display = 'block';
                return;
            }

            // Mostra loading
            loading.style.display = 'block';
            btn.disabled = true;
            resultado.style.display = 'none';

            try {
                const response = await fetch('/buscar-cep', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ cep: cep })
                });

                const data = await response.json();

                if (response.ok) {
                    resultado.className = 'sucesso';
                    resultado.innerHTML = `
                        <h3>✅ Endereço encontrado</h3>
                        <p><strong>CEP:</strong> ${data.cep}</p>
                        <p><strong>Logradouro:</strong> ${data.logradouro}</p>
                        <p><strong>Bairro:</strong> ${data.bairro}</p>
                        <p><strong>Cidade:</strong> ${data.cidade}</p>
                        <p><strong>Estado:</strong> ${data.estado}</p>
                        <hr>
                        <p><strong>Endereço completo:</strong></p>
                        <p>${data.completo}</p>
                    `;
                } else {
                    resultado.className = 'erro';
                    resultado.innerHTML = `<h3>⚠️ Erro</h3><p>${data.erro || 'Erro ao buscar o CEP'}</p>`;
                }
                resultado.style.display = 'block';
            } catch (error) {
                resultado.className = 'erro';
                resultado.innerHTML = `<h3>⚠️ Erro</h3><p>Erro de conexão. Tente novamente.</p>`;
                resultado.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
